name: Source canary

# Weekly: check every official source still fetches and parses as expected,
# without touching the archive, so format changes are caught early.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out the observation archive (read only)
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch origin data:data
            git worktree add data-store data
          else
            mkdir data-store
          fi
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mdbtools libreoffice-writer-nogui
      - uses: astral-sh/setup-uv@v6
      - name: Run canary
        id: canary
        working-directory: pipeline
        continue-on-error: true
        run: |
          uv sync --locked
          uv run pipeline canary --store ../data-store/observations.parquet --out ../canary-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canary-fixture-candidates
          path: canary-out
      - name: Open or update an issue on failure
        if: steps.canary.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Source canary failing"
          body="The weekly live check found a problem with one or more sources:

          \`\`\`json
          $(cat canary-out/canary.json)
          \`\`\`

          Raw fetches are attached to the run as fixture candidates: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
          exit 1
