[project]
name = "pipeline"
version = "0.1.0"
description = "Reservoir data pipeline: fetch official sources, compute weekly snapshots, publish static JSON"
authors = [
    { name = "Izaac Broadbent", email = "izaac.broadbent@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pdfplumber>=0.11.10",
    "polars>=2.0.0",
    "pydantic>=2.14.0",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "mypy>=2.4.0",
    "pyshp>=3.1.6",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "shapely>=2.2.0",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
